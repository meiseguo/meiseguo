<script type="text/javascript">
    var voice = -1;
    var off = -1;
    function playAudio() {
        if(off === 1) {
            var audio = document.querySelector('audio');
            audio.play();
        }
    }
    function start() {
        if(voice === -1){
            voice = setInterval(playAudio, 100);
            setTimeout(function () {
                clearInterval(voice);
                voice = -1;
            }, 30000);
        }
    }
    document.body.onclick = function () {
        playAudio();
        if(voice === -1){
            playAudio();
        } else {
            clearInterval(voice);
            voice = -1;
        }
        off = off * -1
    }
    // 基于准备好的dom，初始化echarts实例
    var myChart = echarts.init(document.getElementById('main'));
    var subChart = echarts.init(document.getElementById('sub'));
    var pending = echarts.init(document.getElementById('pending'));
    var today = echarts.init(document.getElementById('today'));
    var invest = echarts.init(document.getElementById('invest'));
    var prices = echarts.init(document.getElementById('prices'));
    var winning = echarts.init(document.getElementById('winning'));
    var ratio = echarts.init(document.getElementById('ratio'));
    window.addEventListener('resize', function() {
        subChart.resize();
        myChart.resize();
        pending.resize();
        today.resize();
        winning.resize();
        ratio.resize();
    });
    var ccy = location.hash.length < 1 ? 'DOGE-USDT-SWAP' : location.hash.substring(1)

    function updateData() {
    $.post("/statistic/" + ccy, function(ret) {
        if (ret.state === 200) {
            var vo = ret.data
            var record = vo.recordVo
            var option = {
                title: {
                    text: record.rsi,
                    subtext: off === 1 ?'闹':''
                },
                tooltip: {},
                legend: {
                    data: ['涨幅', '跌幅', '最新','反弹','涨','跌']
                },
                xAxis: {
                    data: record.index
                },
                yAxis: {},
                series: [{
                    name: '涨幅',
                    type: 'bar',
                    stack: 'x',
                    data: record.up
                }, {
                    name: '跌幅',
                    type: 'bar',
                    stack: 'x',
                    data: record.down
                },{
                    name: '涨',
                    type: 'line',
                    data: record.upAverage
                },{
                    name: '跌',
                    type: 'line',
                    data: record.downAverage
                },{
                    name: '最新',
                    type: 'bar',
                    stack: 'x',
                    data: record.latest
                },{
                    name: '反弹',
                    type: 'bar',
                    stack: 'x',
                    data: record.bounce
                }]
            };

            // 使用刚指定的配置项和数据显示图表。
            myChart.setOption(option);

            var marker = vo.markerVo
            var optionSub = {
                title: {
                    text: marker.rsi
                },
                tooltip: {},
                legend: {
                    data: ['涨幅', '跌幅', '最新','反弹','涨','跌']
                },
                xAxis: {
                    data: marker.index
                },
                yAxis: {},
                series: [{
                    name: '涨幅',
                    type: 'bar',
                    stack: 'x',
                    data: marker.up
                }, {
                    name: '跌幅',
                    type: 'bar',
                    stack: 'x',
                    data: marker.down
                },{
                    name: '涨',
                    type: 'line',
                    data: marker.upAverage
                },{
                    name: '跌',
                    type: 'line',
                    data: marker.downAverage
                },{
                    name: '最新',
                    type: 'bar',
                    stack: 'x',
                    data: marker.latest
                },{
                    name: '反弹',
                    type: 'bar',
                    stack: 'x',
                    data: marker.bounce
                }]
            };

            // 使用刚指定的配置项和数据显示图表。
            subChart.setOption(optionSub);

            var buysell = {
                title: {
                    text: ''
                },
                tooltip: {},
                legend: {
                    data: ['做多', '做多回撤', '做空', '做空回撤']
                },
                xAxis: {
                    data: vo.xAxis
                },
                yAxis: {},
                series: [{
                    name: '做多',
                    type: 'bar',
                    stack: 'x',
                    data: vo.buy
                }, {
                    name: '做空',
                    type: 'bar',
                    stack: 'x',
                    data: vo.sell
                }, {
                    name: '做多回撤',
                    type: 'bar',
                    stack: 'y',
                    data: vo.buyD
                }, {
                    name: '做空回撤',
                    type: 'bar',
                    stack: 'y',
                    data: vo.sellD
                }]
            };
            pending.setOption(buysell);
            var todayBS = {
                title: {
                    text: vo.sumToday,
                    subtext: vo.todayBS
                },
                tooltip: {},
                legend: {
                    data: ['做多', '做空']
                },
                xAxis: {
                    data: vo.winToday
                },
                yAxis: {},
                series: [{
                    name: '做多',
                    type: 'bar',
                    stack: 'x',
                    data: vo.buyToday
                }, {
                    name: '做空',
                    type: 'bar',
                    stack: 'x',
                    data: vo.sellToday
                }]
            };
            today.setOption(todayBS)
            var ratioBS = {
                title: {
                    text: '盈亏次数',
                    subtext: vo.ratioBS
                },
                tooltip: {},
                legend: {
                    data: ['做多', '做空']
                },
                xAxis: {
                    data: vo.winToday
                },
                yAxis: {},
                series: [{
                    name: '做多',
                    type: 'bar',
                    stack: 'x',
                    data: vo.todayBuy
                }, {
                    name: '做空',
                    type: 'bar',
                    stack: 'x',
                    data: vo.todaySell
                }]
            };
            ratio.setOption(ratioBS)

            var winOption = {
                title: {
                    text: '剩' + vo.timeout
                },
                tooltip: {},
                xAxis: {
                    data: vo.xClosed
                },
                yAxis: {},
                series: [
                    {
                        data: vo.ptdClosed,
                        type: 'bar'
                    }
                ]
            };
            winning.setOption(winOption);

            var pricesOption = {
                title: {
                    text: ''
                },
                tooltip: {},
                legend: {
                    data: vo.legend
                },
                xAxis: {
                    data: vo.count
                },
                yAxis: {
                    type: 'value',
                    name: vo.current,
                    max: vo.high,
                    min: vo.low
                },
                series: vo.series
            };
            prices.setOption(pricesOption);

            var invested = {
                title: {
                    text: ccy
                },
                tooltip: {},
                series: [
                    {
                        type: 'pie',
                        data: [
                            {
                                value: vo.invest[0],
                                name: vo.pie[0]
                            },
                            {
                                value: vo.invest[1],
                                name: vo.pie[1]
                            },
                            {
                                value: vo.invest[2],
                                name: vo.pie[2]
                            },
                            {
                                value: vo.invest[3],
                                name: vo.pie[3]
                            }
                        ]
                    }
                ]
            };
            invest.setOption(invested);
            if(vo.desc > 1) {
                if(vo.recordVo.upDown < -1*vo.recordVo.downAverage[0] || vo.recordVo.goBack < -1*vo.recordVo.downAverage[0]) {
                    start();
                }
            }
            if(vo.asc > 1) {
                if(vo.recordVo.upDown > vo.recordVo.upAverage[0] || vo.recordVo.goBack > vo.recordVo.upAverage[0]) {
                    start();
                }
            }
            if(vo.recordVo.upDown > 0.02 || vo.recordVo.goBack > 0.02 || vo.recordVo.upDown < -0.02 || vo.recordVo.goBack < -0.02) {
                start();
            }
        } else {
            console.log(ret.msg)
        }
    });
    }
    setInterval(updateData, 1000);
</script>
</body>
</html>
